# Managed by Ansible.
# 24-hour retention per ADR-009. copy-truncate so journald never
# drops a line in flight.
{
    daily
    rotate 1
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    create 0640 root root
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
    endscript
}
