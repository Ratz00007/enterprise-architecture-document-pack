# Promtail config. Shipped to every host by the common Ansible role.

server:
  http_listen_port: 9080

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://10.50.70.11:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: journal
    journal:
      max_age: 24h
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'service'
      - source_labels: ['__journal_priority_keyword']
        target_label: 'level'
      - source_labels: ['__journal__hostname']
        target_label: 'host'
      - target_label: 'env'
        replacement: 'dev'  # overwritten by the per-env Ansible template

  - job_name: app
    static_configs:
      - targets: [localhost]
        labels:
          job: claims-api
          env: dev  # overwritten by the per-env Ansible template
          service: claims-api
          host: ${HOSTNAME}
          __path__: /var/log/claims-api/*.log
