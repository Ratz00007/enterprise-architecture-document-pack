server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: claims-api
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acme_claims}
    username: ${DB_USER:acme_user}
    password: ${DB_PASSWORD:acme_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterAccess=600s

# Keycloak Configuration
keycloak:
  enabled: true
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:acme-claims}
  resource: ${KEYCLOAK_CLIENT_ID:claims-api}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:backend-secret}
  principal-attribute: preferred_username
  bearer-only: true

# GenAI Gateway Configuration
genai:
  gateway:
    url: ${GENAI_GATEWAY_URL:http://localhost:9000}
    api-key: ${GENAI_API_KEY:dev-api-key}
    timeout: 30000
    retry:
      max-attempts: 3
      backoff-ms: 1000

# OpenTelemetry Configuration
otel:
  service:
    name: claims-api
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  metrics:
    export:
      interval: 10000

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,heapdump
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Application-specific settings
acme:
  claims:
    workflow:
      stages:
        - FNOL
        - TRIAGE
        - ADJUDICATION
        - PAYOUT
      sla:
        fnol-to-triage-hours: 24
        triage-to-adjudication-hours: 48
        adjudication-to-payout-hours: 72
    pii:
      masking-enabled: true
      encryption-algorithm: AES-256-GCM
    database:
      operational:
        name: acme_claims_ops
      analytics:
        name: acme_claims_analytics
      sync-interval-ms: 5000

# Logging Configuration
logging:
  level:
    root: INFO
    com.acme.claims: DEBUG
    org.springframework.security: DEBUG
    org.keycloak: INFO
    io.opentelemetry: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - trace_id=%X{trace_id} span_id=%X{span_id} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - trace_id=%X{trace_id} span_id=%X{span_id} - %msg%n"
  file:
    name: /var/log/acme-claims/backend.log
