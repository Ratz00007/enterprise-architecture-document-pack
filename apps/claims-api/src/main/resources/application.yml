server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: claims-api
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acme_claims}
    username: ${DB_USER:acme_user}
    password: ${DB_PASSWORD:acme_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/acme-claims}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/acme-claims/protocol/openid-connect/certs}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterAccess=600s

genai:
  gateway:
    url: ${GENAI_GATEWAY_URL:http://localhost:9000}
    api-key: ${GENAI_API_KEY:dev-api-key}

otel:
  service:
    name: claims-api
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.acme.claims: DEBUG
