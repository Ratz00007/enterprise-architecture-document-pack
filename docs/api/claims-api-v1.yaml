openapi: 3.1.0
info:
  title: Acme Claims API
  version: 1.0.0
  description: |
    Claims lifecycle API (FNOL → Triage → Adjudication → Payout → Closed).

    Conventions (AGENTS.md, ADR-021..024):
    - Money values are BIGINT minor units (integer cents), field names end in
      `AmountMinor`.
    - All timestamps are UTC (ISO-8601, Z suffix).
    - Primary keys are UUIDv7.
    - Every state-mutating request REQUIRES an `Idempotency-Key` header
      (ADR-023). Replaying the same key with the same payload returns the
      original response with `Idempotency-Replayed: true`; reusing the key
      with a different payload is HTTP 409.
    - Illegal lifecycle transitions return HTTP 409; claims are never deleted.
  contact:
    name: Acme Claims platform team
servers:
  - url: http://localhost:8080/api/v1
    description: local compose stack
security:
  - bearerAuth: []

tags:
  - name: claims
    description: Claim intake and lifecycle

paths:
  /claims:
    get:
      tags: [claims]
      summary: List claims
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ClaimStatus" }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Page of claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: "#/components/schemas/Claim" } }
                  totalElements: { type: integer }
                  totalPages: { type: integer }
                  number: { type: integer }
                  size: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [claims]
      summary: Submit an FNOL
      description: Creates a claim in FNOL state.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClaimRequest" }
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /claims/{id}:
    get:
      tags: [claims]
      summary: Get a claim by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /claims/number/{claimNumber}:
    get:
      tags: [claims]
      summary: Get a claim by claim number
      parameters:
        - in: path
          name: claimNumber
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /claims/{id}/triage:
    post:
      tags: [claims]
      summary: Move FNOL claim into triage
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageRequest" }
      responses:
        "200":
          description: Claim in TRIAGE
          content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /claims/{id}/adjudication:
    post:
      tags: [claims]
      summary: Move triaged claim into adjudication
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjudicationRequest" }
      responses:
        "200":
          description: Claim in ADJUDICATION
          content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /claims/{id}/approve:
    post:
      tags: [claims]
      summary: Approve the claim
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalRequest" }
      responses:
        "200":
          description: Claim APPROVED
          content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /claims/{id}/reject:
    post:
      tags: [claims]
      summary: Reject the claim
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectionRequest" }
      responses:
        "200":
          description: Claim REJECTED
          content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /claims/{id}/payout:
    post:
      tags: [claims]
      summary: Initiate payout
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutRequest" }
      responses:
        "200":
          description: Claim in PAYOUT
          content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /claims/{id}/payout/complete:
    post:
      tags: [claims]
      summary: Complete the payout (copies approved amount to paid)
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Claim PAID
          content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /claims/{id}/close:
    post:
      tags: [claims]
      summary: Close the claim (from PAID or REJECTED)
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Claim CLOSED (terminal)
          content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } }
        "409": { $ref: "#/components/responses/InvalidTransition" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm `acme-claims` access token.

  parameters:
    ClaimId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, maxLength: 255 }
      description: Unique key per operation attempt (ADR-023).

  responses:
    BadRequest:
      description: Validation error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Missing or invalid bearer token
    NotFound:
      description: Claim not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    InvalidTransition:
      description: Lifecycle transition not allowed from the current state
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    IdempotencyConflict:
      description: Idempotency key reused with a different payload
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    ClaimStatus:
      type: string
      enum: [FNOL, TRIAGE, ADJUDICATION, APPROVED, REJECTED, PAYOUT, PAID, CLOSED]
      description: ADR-021 lifecycle states.
    ClaimType:
      type: string
      enum: [AUTO, PROPERTY, HEALTH, LIFE, LIABILITY, WORKERS_COMP, OTHER]
    CreateClaimRequest:
      type: object
      required: [policyNumber, claimType, incidentDate]
      properties:
        policyNumber: { type: string, maxLength: 50 }
        claimType: { $ref: "#/components/schemas/ClaimType" }
        incidentDate: { type: string, format: date-time }
        description: { type: string, maxLength: 10000 }
        estimatedAmountMinor: { type: integer, format: int64, minimum: 0, description: "minor units (ADR-022)" }
    TriageRequest:
      type: object
      required: [priority, score]
      properties:
        priority: { type: integer, minimum: 1, maximum: 5 }
        score: { type: number, minimum: 0, maximum: 100 }
        assignedTo: { type: string }
    AdjudicationRequest:
      type: object
      properties:
        notes: { type: string }
    ApprovalRequest:
      type: object
      required: [approvedAmountMinor]
      properties:
        approvedAmountMinor: { type: integer, format: int64, minimum: 0 }
    RejectionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    PayoutRequest:
      type: object
      required: [payoutReference]
      properties:
        payoutReference: { type: string, minLength: 1 }
    Claim:
      type: object
      properties:
        id: { type: string, format: uuid }
        claimNumber: { type: string }
        policyNumber: { type: string }
        status: { $ref: "#/components/schemas/ClaimStatus" }
        claimType: { $ref: "#/components/schemas/ClaimType" }
        incidentDate: { type: string, format: date-time }
        reportedDate: { type: string, format: date-time }
        description: { type: [string, "null"] }
        estimatedAmountMinor: { type: [integer, "null"] }
        approvedAmountMinor: { type: [integer, "null"] }
        paidAmountMinor: { type: [integer, "null"] }
        assignedTo: { type: [string, "null"] }
        triagePriority: { type: [integer, "null"] }
        triageScore: { type: [number, "null"] }
        adjudicationNotes: { type: [string, "null"] }
        rejectionReason: { type: [string, "null"] }
        payoutReference: { type: [string, "null"] }
        payoutDate: { type: [string, "null"], format: date-time }
        version: { type: [integer, "null"] }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        createdBy: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
